# Pipeline CI cho dự án Quản lý nhân sự (Spring Boot + Gradle + PostgreSQL)

stages:
  - test
  - build

variables:
  # Cache Gradle trong thư mục project để GitLab cache lại được
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x ./gradlew

# ===== STAGE 1: TEST =====
test_job:
  stage: test
  image: gradle:7.6-jdk17
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    # Biến để container PostgreSQL tự tạo database và user
    POSTGRES_DB: hr_db
    POSTGRES_USER: hr_user
    POSTGRES_PASSWORD: hr_password
    # Biến để Spring Boot kết nối tới DB (host = tên alias của service)
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/hr_db"
    SPRING_DATASOURCE_USERNAME: hr_user
    SPRING_DATASOURCE_PASSWORD: hr_password
  script:
    - ./gradlew test

# ===== STAGE 2: BUILD =====
build_job:
  stage: build
  image: gradle:7.6-jdk17
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day