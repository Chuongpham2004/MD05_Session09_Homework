# Pipeline CI cho dự án Quản lý nhân sự (Spring Boot + Gradle + PostgreSQL)

stages:
  - test
  - build
  - dockerize

variables:
  # Cache Gradle trong thư mục project để GitLab cache lại được
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x ./gradlew

# ===== STAGE 1: TEST =====
test_job:
  stage: test
  image: gradle:7.6-jdk17
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    # Biến để container PostgreSQL tự tạo database và user
    POSTGRES_DB: hr_db
    POSTGRES_USER: hr_user
    POSTGRES_PASSWORD: hr_password
    # Biến để Spring Boot kết nối tới DB (host = tên alias của service)
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/hr_db"
    SPRING_DATASOURCE_USERNAME: hr_user
    SPRING_DATASOURCE_PASSWORD: hr_password
  script:
    - ./gradlew test

# ===== STAGE 2: BUILD =====
build_job:
  stage: build
  image: gradle:7.6-jdk17
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day

# ===== STAGE 3: DOCKERIZE =====
docker_job:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: "$DOCKER_USERNAME/payment-service"
  dependencies:
    - build_job            # tải file .jar từ artifacts của build_job
  before_script:
    - ls -l build/libs     # kiểm tra file jar đã có
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME:latest
  after_script:
    - docker logout