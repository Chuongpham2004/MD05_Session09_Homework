# Pipeline CI cho User Service (Spring Boot + Gradle, JDK 17)

# Image Docker chứa sẵn JDK 17 để chạy Gradle Wrapper (./gradlew)
image: eclipse-temurin:17-jdk

# stages phải là một mảng (list) YAML
stages:
  - build_app

variables:
  # Lưu cache Gradle bên trong thư mục project để GitLab có thể cache lại
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  # Đảm bảo gradlew có quyền thực thi trên Linux runner
  - chmod +x ./gradlew
  - java -version

build_job:
  stage: build_app
  script:
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
